name: publish-release

# 署名済み APK から GitHub リリースを公開する。
# リリース APK は CI の外で署名する (署名鍵は GitHub に保存しない)。
# リリース方法: 次を含む release-publish という名前のブランチを push する
#   apk/Prune-<version>.apk と apk/SHA256SUMS.txt、および docs/release-notes/v<version>.md
on:
  push:
    branches: [release-publish]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check APK and checksum
        run: |
          cd apk && sha256sum -c SHA256SUMS.txt
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs Prune-*.apk | grep -q "CN=cyb3rl00m"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(ls apk/Prune-*.apk | sed -E 's/.*Prune-(.*)\.apk/\1/')
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "Release $TAG already exists"; exit 1; }
          gh release create "$TAG" apk/Prune-$VERSION.apk apk/SHA256SUMS.txt \
            --target main --title "Prune $VERSION" --notes-file "docs/release-notes/$TAG.md" --latest
          git push origin --delete release-publish || true
